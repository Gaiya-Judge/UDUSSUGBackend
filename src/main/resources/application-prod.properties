# ==========================================
# PROD - PostgreSQL Database Configuration
# ==========================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Prod JPA Settings (Strict validation, no auto schema changes, no SQL logging)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ==========================================
# PROD - Mail Settings (Production SMTP)
# ==========================================
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==========================================
# PROD - Web3j Sepolia Config
# ==========================================
blockchain.rpc.url=${INFURA_RPC_URL}
blockchain.private.key=${ADMIN_PRIVATE_KEY}
blockchain.contract.address=${CONTRACT_ADDRESS}
app.web3j.chain-id=${CHAIN_ID:11155111}

# ==========================================
# Admin Initial Seeder Properties
# ==========================================
app.admin.default-email={ADMIN_EMAIL}
app.admin.default-password=${ADMIN_LOGIN_PASSWORD}

# ==========================================
# JWT Secret Key (HMAC-SHA256 256+ bit secret)
# ==========================================
app.jwt.secret={SECRETKEY}