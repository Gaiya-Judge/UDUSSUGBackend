<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voter Login - UDUS SUG Student Union Elections</title>
    <meta name="description"
        content="Voter Login for Usmanu Danfodiyo University Students Union Government Blockchain Voting System.">

    <!-- Typography: Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Institutional Shared Foundation CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- V1 Login Specific CSS (Visual match to reference design) -->
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <!-- Institutional Header -->
    <header class="site-header">
        <div class="container-fluid">
            <div class="header-brand">
                <img src="images/udus-logo.png" alt="UDUS University Crest" class="header-logo" width="48" height="48">
                <div class="header-brand-text">
                    <span class="brand-university">Usmanu Danfodiyo University</span>
                    <span class="brand-subtext">SUG Student Union Elections</span>
                </div>
            </div>
            <nav class="header-nav" aria-label="Main Navigation">
                <a href="index.html" class="header-nav-link active" aria-current="page">Home</a>
                <a href="#" class="header-nav-link" tabindex="0">About</a>
                <a href="#" class="header-nav-link" tabindex="0">FAQ</a>
            </nav>
        </div>
    </header>

    <!-- Main Content Area with Campus & Crest Background Overlay -->
    <main class="login-main-wrapper" id="main-content">
        <section class="login-card" aria-labelledby="loginHeading">
            <!-- Circular Purple User Icon -->
            <div class="login-avatar-circle" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                    <circle cx="12" cy="7" r="4" />
                </svg>
            </div>

            <!-- Card Heading & Supporting Description -->
            <h1 id="loginHeading" class="login-card-title">Voter Login</h1>
            <p class="login-card-subtitle">Enter your admission number to continue with the voting process.</p>

            <!-- Alert Container for Dynamic UI Feedback -->
            <div id="alert-container" class="mb-3" aria-live="polite"></div>

            <!-- Login Form -->
            <form id="loginForm" novalidate>
                <div class="mb-3 text-start">
                    <label for="admissionNumber" class="login-form-label">
                        Admission Number <span class="required-asterisk" aria-hidden="true">*</span>
                    </label>
                    <input type="text" class="login-input" id="admissionNumber" name="admissionNumber"
                        placeholder="e.g. 2212101111" autocomplete="off" required aria-required="true">
                </div>

                <button type="submit" id="loginSubmitBtn" class="btn-login-submit">
                    <span>Continue</span>
                    <span aria-hidden="true">&rarr;</span>
                </button>
            </form>

            <!-- Card Divider -->
            <hr class="login-card-divider">

            <!-- Help Contact Text -->
            <div class="login-help-wrapper">
                <svg class="login-help-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"
                    aria-hidden="true">
                    <path
                        d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zM5.496 6.033h.825c.138 0 .248-.113.266-.25.09-.656.54-1.134 1.342-1.134.686 0 1.314.343 1.314 1.168 0 .635-.374.927-.965 1.371-.673.489-1.206 1.06-1.168 1.987l.003.217a.25.25 0 0 0 .25.246h.811a.25.25 0 0 0 .25-.25v-.105c0-.718.273-.927 1.01-1.486.609-.463 1.244-.977 1.244-2.056 0-1.511-1.276-2.241-2.673-2.241-1.267 0-2.655.59-2.75 2.286a.237.237 0 0 0 .241.247zm2.325 6.443c.61 0 1.029-.394 1.029-.927 0-.552-.42-.94-1.029-.94-.584 0-1.009.388-1.009.94 0 .533.425.927 1.01.927z" />
                </svg>
                <span>Need help? Contact the SUG ICT Team.</span>
            </div>
        </section>
    </main>

    <!-- Institutional Footer -->
    <footer class="site-footer">
        <div class="container-fluid">
            <p class="footer-copy">&copy; 2025 Usmanu Danfodiyo University. All rights reserved.</p>
            <p class="footer-pillars">
                <span>Transparent</span>
                <span class="pillar-bullet">&bull;</span>
                <span>Fair</span>
                <span class="pillar-bullet">&bull;</span>
                <span>Credible</span>
            </p>
        </div>
    </footer>

    <!-- Bootstrap 5 Bundle JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Page Logic -->
    <script type="module" src="js/login.js"></script>
</body>

</html>
