<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Your Identity - UDUS SUG Student Union Elections</title>
    <meta name="description" content="Verify voter identity with 6-digit OTP code for Usmanu Danfodiyo University Students Union Government Blockchain Voting System.">

    <!-- Typography: Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Institutional Shared Foundation CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Login & Verification CSS (Visual match to reference design) -->
    <link rel="stylesheet" href="css/login.css">

    <!-- Reusable Pop-up CSS -->
    <link rel="stylesheet" href="css/popup.css">
</head>
<body>

    <!-- Institutional Header (Identical shell across V1 and V2) -->
    <header class="site-header">
        <div class="container-fluid">
            <div class="header-brand">
                <img src="images/udus-logo.png" alt="UDUS University Crest" class="header-logo" width="48" height="48">
                <div class="header-brand-text">
                    <span class="brand-university">Usmanu Danfodiyo University</span>
                    <span class="brand-subtext">SUG Student Union Elections</span>
                </div>
            </div>
            <nav class="header-nav" aria-label="Main Navigation">
                <a href="index.html" class="header-nav-link">Home</a>
                <a href="about.html" class="header-nav-link">About</a>
                <a href="faq.html" class="header-nav-link">FAQ</a>
            </nav>
        </div>
    </header>

    <!-- Main Content Area with Campus & Crest Background Overlay -->
    <main class="login-main-wrapper" id="main-content">
        <section class="login-card" aria-labelledby="verifyHeading">
            <!-- Circular Lavender Shield Badge with White Padlock -->
            <div class="verify-avatar-circle" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 46" width="30" height="36">
                    <!-- Purple Shield -->
                    <path d="M20 1 L37 6.5 C37 24 27.5 38 20 44 C12.5 38 3 24 3 6.5 Z" fill="#372859" />
                    <!-- White Padlock Shackle -->
                    <path d="M15 20 V15.5 C15 12.8 17.2 10.5 20 10.5 C22.8 10.5 25 12.8 25 15.5 V20" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
                    <!-- White Padlock Body -->
                    <rect x="13" y="19" width="14" height="11" rx="2" fill="#FFFFFF" />
                    <!-- Keyhole -->
                    <circle cx="20" cy="23.5" r="1.4" fill="#372859" />
                    <rect x="19.2" y="23.5" width="1.6" height="3" fill="#372859" />
                </svg>
            </div>

            <!-- Card Heading & Supporting Description -->
            <h1 id="verifyHeading" class="login-card-title">Verify Your Identity</h1>
            <p class="login-card-subtitle">We've sent a 6-digit code to the email linked with your admission number.</p>

            <!-- Alert Container for Dynamic UI Feedback -->
            <div id="alert-container" class="mb-3" aria-live="polite"></div>

            <!-- Verification Form -->
            <form id="verifyForm" novalidate>
                <!-- Segmented 6-Digit OTP Box Row -->
                <div class="otp-input-container">
                    <input
                        type="text"
                        id="otpInput"
                        name="otpCode"
                        class="otp-hidden-input"
                        inputmode="numeric"
                        maxlength="6"
                        autocomplete="one-time-code"
                        pattern="[0-9]*"
                        aria-label="6-digit verification code"
                        required
                        autofocus
                    >
                    <div class="otp-boxes" aria-hidden="true">
                        <div class="otp-box empty" data-index="0">&mdash;</div>
                        <div class="otp-box empty" data-index="1">&mdash;</div>
                        <div class="otp-box empty" data-index="2">&mdash;</div>
                        <div class="otp-box empty" data-index="3">&mdash;</div>
                        <div class="otp-box empty" data-index="4">&mdash;</div>
                        <div class="otp-box empty" data-index="5">&mdash;</div>
                    </div>
                </div>

                <!-- Resend Code Timer Row -->
                <div class="resend-wrapper" id="resendWrapper">
                    <svg class="resend-clock-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                    <span>Resend code in <strong class="resend-timer-bold" id="countdownTimer">02:45</strong></span>
                </div>

                <!-- Verify Primary Button -->
                <button type="submit" id="verifySubmitBtn" class="btn-login-submit">
                    <span>Verify</span>
                    <span aria-hidden="true">&rarr;</span>
                </button>

                <!-- Back Secondary Button -->
                <a href="login.html" class="btn-verify-back" id="backBtn">Back</a>
            </form>
        </section>
    </main>

    <!-- Institutional Footer (Identical across pages) -->
    <footer class="site-footer">
        <div class="container-fluid">
            <p class="footer-copy">&copy; 2025 Usmanu Danfodiyo University. All rights reserved.</p>
            <p class="footer-pillars">
                <span>Transparent</span>
                <span class="pillar-bullet">&bull;</span>
                <span>Fair</span>
                <span class="pillar-bullet">&bull;</span>
                <span>Credible</span>
            </p>
        </div>
    </footer>

    <!-- Bootstrap 5 Bundle JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Reusable Pop-up Component -->
    <script src="js/popup.js"></script>

    <!-- V2 Page Logic -->
    <script type="module" src="js/verify.js"></script>
</body>
</html>
